[project]
name = "sgr"
version = "0.1.0"
description = "Swarm-Guided Rescue: a drone swarm that maps a burning building and guides a firefighter"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco==3.17.0",           # pinned: 4.0.0 split the package; do not upgrade during the event
    "fastapi",
    "uvicorn",
    "pydantic>=2,<3",
    "numpy",
    "opencv-python-headless",
    "trimesh",
    "scikit-image",
    "httpx",
    "pillow",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
sgr = "sgr.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sgr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
